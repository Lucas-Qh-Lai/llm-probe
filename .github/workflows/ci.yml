name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS · build, self test, unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build everything
        run: swift build

      - name: Offline self test (must stay 100% green)
        run: swift run llmprobe selftest

      - name: Cross-build Intel (x86_64) binaries
        run: |
          swift build -c release --product llmprobe --arch x86_64
          swift build -c release --product LLMProbeApp --arch x86_64
          BIN_PATH="$(swift build -c release --arch x86_64 --show-bin-path)"
          lipo -archs "$BIN_PATH/llmprobe" | grep -qx x86_64
          lipo -archs "$BIN_PATH/LLMProbeApp" | grep -qx x86_64

      - name: Unit tests
        run: swift test

      - name: CLI smoke test (no credentials, no network)
        run: |
          ./.build/debug/llmprobe version
          ./.build/debug/llmprobe list-sources
          # `--help` must print usage and exit 0, never run the command.
          ./.build/debug/llmprobe probe --help | grep -q "USAGE"
          ./.build/debug/llmprobe import --help | grep -q "USAGE"
          if ./.build/debug/llmprobe import --no-locl 2>/dev/null; then
            echo "unknown option was accepted" >&2; exit 1
          fi

  linux:
    name: Linux · CLI (best effort, untested by the maintainer)
    runs-on: ubuntu-latest
    # The GUI is SwiftUI/AppKit and macOS-only, and the maintainer has no Linux
    # machine: this job proves the portable half still compiles, and it is
    # deliberately informational instead of a merge gate. See README → "Cross
    # platform status".
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Build the portable targets only
        run: swift build --product llmprobe

      - name: Offline self test
        run: ./.build/debug/llmprobe selftest

  privacy:
    name: Privacy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan the tree for credentials, machine paths and capture metadata
        run: ./scripts/check_privacy.sh
